name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor 7
        run: npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor JSON configuration
        run: |
          node -e "require('node:fs').writeFileSync('capacitor.config.json', JSON.stringify({ appId: 'com.byhrsn.dslrsim', appName: 'Byhrsn DSLR Sim', webDir: 'dist', bundledWebRuntime: false }, null, 2) + '\\n')"
          cat capacitor.config.json

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Byhrsn-DSLR-Sim-Android-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
